<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AntiZapret — открытие</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #101010; color: #e8e8e8; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .box { max-width: 420px; padding: 28px; border-radius: 12px; background: #1a1a1a; border: 1px solid #2e2e2e; text-align: center; }
    a.btn {
      display: inline-block; margin-top: 8px; padding: 12px 20px; border-radius: 8px;
      background: #2b6cb0; color: #fff !important; text-decoration: none; font-weight: 600;
    }
    a.btn:hover { background: #3182ce; }
    a { color: #4ea1ff; }
    .muted { color: #888; font-size: 14px; margin-top: 12px; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1 style="margin-top:0;font-size:20px;">AntiZapret</h1>
    <p id="status">Готовлю ссылку…</p>
    <p><a class="btn" id="open" href="#">Открыть в AntiZapret</a></p>
    <p class="muted">
      Firefox и некоторые браузеры блокируют автозапуск приложений —
      нажмите кнопку выше и разрешите открытие <code>antizapret://</code>.
    </p>
  </div>
  <script>
    (function () {
      async function resolveTarget() {
        const params = new URLSearchParams(location.search);
        const type = (params.get("t") || params.get("type") || "").toLowerCase();

        // VPN server share-URI (config), not subscription:
        //   ?t=vpn&u=<urlencoded share>
        //   ?t=vpn&b=<base64url(share)>
        //   ?t=vpn&z=<base64url(zlib(share))>
        if (type === "vpn" || type === "import") {
          // Pass compact payloads through as-is. Expanding to url=<vless://...?a=1&b=2>
          // breaks when Windows/browsers decode %26 back to '&' before the app parses query.
          if (params.get("z"))
            return "antizapret://import?z=" + params.get("z");
          if (params.get("b"))
            return "antizapret://import?b=" + params.get("b");
          const share = params.get("u") || params.get("url") || "";
          if (share)
            return "antizapret://import?url=" + encodeURIComponent(share);
          return "";
        }

        if (type === "az" || type === "strategy" || type === "antizapret") {
          const id = params.get("id") || params.get("strategy") || "";
          const start = params.get("start") || "1";
          if (!id) return "";
          return "antizapret://strategy?id=" + encodeURIComponent(id) + "&start=" + encodeURIComponent(start);
        }

        let target = params.get("u") || params.get("uri") || "";
        if (!target && location.hash.length > 1)
          target = decodeURIComponent(location.hash.slice(1));
        return target;
      }

      function tryLaunch(target) {
        // Prefer real user-clickable <a href> (required by Firefox for custom protocols).
        // Also attempt an automatic navigation for Chromium; it may be blocked — button remains.
        try {
          const iframe = document.createElement("iframe");
          iframe.style.display = "none";
          iframe.src = target;
          document.body.appendChild(iframe);
          setTimeout(function () {
            try { document.body.removeChild(iframe); } catch (e) {}
          }, 2000);
        } catch (e) {}
        try { window.location.href = target; } catch (e) {}
      }

      const link = document.getElementById("open");
      const status = document.getElementById("status");
      resolveTarget().then(function (target) {
        if (!target || target.indexOf("antizapret:") !== 0) {
          status.textContent = "Некорректная ссылка приглашения.";
          link.style.display = "none";
          return;
        }
        link.href = target;
        status.textContent = "Нажмите кнопку, чтобы открыть AntiZapret.";
        tryLaunch(target);
      }).catch(function () {
        status.textContent = "Не удалось разобрать ссылку приглашения.";
        link.style.display = "none";
      });
    })();
  </script>
</body>
</html>
